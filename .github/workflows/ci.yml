name: Sales Service CI

on:
  push:
    branches: [main, developer]
    paths:
      - 'sales-service/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, developer]
    paths:
      - 'sales-service/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar njsscan
        run: python -m pip install --user njsscan

      - name: Executar análise SAST
        run: ~/.local/bin/njsscan sales-service

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales-service
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sales-service/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Validar sintaxe do runtime
        run: |
          node --check index.js
          node --check app.js